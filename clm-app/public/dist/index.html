
<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/logo-BU5yR0AT.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Centralized Litigation Management System</title>
    <style>
      body {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        margin: 0;
        padding: 0;
      }

      /* Fix for sidebar icons - prevent SVGs from expanding */
      aside svg,
      nav svg,
      header svg {
        width: 1.5rem !important;
        height: 1.5rem !important;
        min-width: 1.5rem !important;
        min-height: 1.5rem !important;
        max-width: 1.5rem !important;
        max-height: 1.5rem !important;
        flex-shrink: 0 !important;
      }

      /* ========== Initial Loading Screen ========== */
      #initial-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #0a0f0a 0%, #1a2e1a 50%, #0a0f0a 100%);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 99999;
        transition: opacity 0.5s ease-out, visibility 0.5s ease-out;
      }

      #initial-loader.hidden {
        opacity: 0;
        visibility: hidden;
      }

      /* Logo container with subtle glow */
      .loader-logo-container {
        position: relative;
        margin-bottom: 50px;
        animation: logoFadeIn 0.8s ease-out forwards;
      }

      .loader-logo-container::before {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 280px;
        height: 180px;
        background: radial-gradient(ellipse at center, rgba(201, 168, 71, 0.15) 0%, transparent 70%);
        filter: blur(30px);
        z-index: -1;
      }

      .loader-logo {
        max-width: 320px;
        height: auto;
        filter: drop-shadow(0 4px 20px rgba(201, 168, 71, 0.3));
      }

      /* Progress bar container */
      .loader-progress-container {
        width: 280px;
        animation: progressFadeIn 0.6s ease-out 0.3s forwards;
        opacity: 0;
      }

      /* Modern progress bar track */
      .loader-progress-track {
        width: 100%;
        height: 4px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 4px;
        overflow: hidden;
        position: relative;
        box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.3);
      }

      /* Animated progress bar */
      .loader-progress-bar {
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg, #3E7443, #4A8F50, #C9A847, #DAB955);
        background-size: 300% 100%;
        border-radius: 4px;
        animation: progressGrow 2.5s ease-in-out forwards, progressShimmer 1.5s ease-in-out infinite;
        position: relative;
      }

      .loader-progress-bar::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
        animation: progressGlare 1.5s ease-in-out infinite;
      }

      /* Loading text */
      .loader-text {
        margin-top: 20px;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-size: 13px;
        font-weight: 400;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.5);
        animation: textPulse 2s ease-in-out infinite;
      }

      /* Keyframe animations */
      @keyframes logoFadeIn {
        0% {
          opacity: 0;
          transform: translateY(-20px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes progressFadeIn {
        0% {
          opacity: 0;
          transform: translateY(10px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes progressGrow {
        0% {
          width: 0%;
        }
        20% {
          width: 25%;
        }
        50% {
          width: 60%;
        }
        80% {
          width: 85%;
        }
        100% {
          width: 100%;
        }
      }

      @keyframes progressShimmer {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }

      @keyframes progressGlare {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(100%);
        }
      }

      @keyframes textPulse {
        0%, 100% {
          opacity: 0.5;
        }
        50% {
          opacity: 0.8;
        }
      }
    </style>







  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.29.0"
  }
}
  </script>
  <script type="module" crossorigin src="/assets/index-CRJcDuHr.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-CrMpmKSj.css">
</head>
  <body>
    <!-- Initial Loading Screen -->
    <div id="initial-loader">
      <div class="loader-logo-container">
        <img src="/assets/logo-BU5yR0AT.png" alt="Sarie Eldin & Partners" class="loader-logo" />
      </div>
      <div class="loader-progress-container">
        <div class="loader-progress-track">
          <div class="loader-progress-bar"></div>
        </div>
        <div class="loader-text">Loading</div>
      </div>
    </div>

    <div id="root"></div>

    <script>
      // Hide loader when React app is ready
      const hideLoader = () => {
        const loader = document.getElementById('initial-loader');
        if (loader) {
          loader.classList.add('hidden');
          // Remove from DOM after transition
          setTimeout(() => {
            loader.remove();
          }, 500);
        }
      };

      // Observer to detect when React mounts content
      const observer = new MutationObserver((mutations) => {
        const root = document.getElementById('root');
        if (root && root.children.length > 0) {
          hideLoader();
          observer.disconnect();
        }
      });

      // Start observing
      const root = document.getElementById('root');
      if (root) {
        observer.observe(root, { childList: true });
      }

      // Fallback: hide after max 5 seconds regardless
      setTimeout(hideLoader, 5000);
    </script>
  </body>
</html>
